[package]
name = "llm-harmony"
version = "0.1.0"
edition = "2021"

[lib]
name = "llm_harmony"
path = "src/lib.rs"

[[bin]]
name = "llm-harmony"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
libproc = "0.14"
sysinfo = "0.39"
walkdir = "2"
serde_yaml = "0.9"
